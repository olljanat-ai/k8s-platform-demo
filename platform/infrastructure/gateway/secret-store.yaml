# Platform level Key Vault access via External Secrets Operator + workload
# identity. Only usable from the gateway namespace, tenants get their own
# SecretStore (see tenants/_template/components/key-vault).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-keyvault
  namespace: ${gateway_namespace}
  annotations:
    azure.workload.identity/client-id: ${platform_keyvault_client_id}
    azure.workload.identity/tenant-id: ${azure_tenant_id}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: platform-keyvault
  namespace: ${gateway_namespace}
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: ${platform_keyvault_url}
      serviceAccountRef:
        name: platform-keyvault
