apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ${gateway_name}
  namespace: ${gateway_namespace}
spec:
  gatewayClassName: ${gateway_class_name}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.${cluster_domain}"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              platform.example.com/gateway-access: "true"
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.${cluster_domain}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-apps-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              platform.example.com/gateway-access: "true"
