# Objects that the platform places into tenant namespaces (RBAC, network
# policies, Flux sync objects, platform-vars ...) carry the label
# "platform.example.com/managed: true". Tenants are namespace admins, so this
# policy stops them (and their Flux service account) from changing or
# deleting those objects. Only Flux running in flux-system (i.e. the platform
# repository), Kubernetes controllers and break-glass admins may do it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: platform-managed-objects
spec:
  failurePolicy: Fail
  matchConstraints:
    objectSelector:
      matchLabels:
        platform.example.com/managed: "true"
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        resources: ["*"]
        operations: ["UPDATE", "DELETE"]
  validations:
    - expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:flux-system:') ||
        request.userInfo.username.startsWith('system:serviceaccount:kube-system:') ||
        request.userInfo.username == 'system:kube-controller-manager' ||
        'system:masters' in request.userInfo.groups
      messageExpression: >-
        'object is managed by the platform repository and cannot be changed by ' +
        request.userInfo.username
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: platform-managed-objects
spec:
  policyName: platform-managed-objects
  validationActions: ["Deny"]
