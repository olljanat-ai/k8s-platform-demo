# Tenant onboarding. Lists which tenant instances exist in this cluster
# (see ./tenants/kustomization.yaml).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenants
  namespace: flux-system
spec:
  dependsOn:
    - name: policies
  interval: 10m
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./clusters/production/tenants
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
