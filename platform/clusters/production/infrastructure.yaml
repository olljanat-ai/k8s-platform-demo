# Cluster wide platform configuration, shared by all clusters.
# Expected to be pre-installed by Terraform (see ../../infra/README.md):
#   - Gateway API CRDs + gateway controller (GatewayClass from cluster-vars)
#   - External Secrets Operator
---
# Admission policies. Tenants are onboarded only after these are in place.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policies
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/policies
  prune: true
  wait: true
---
# Shared Gateway + its TLS certificate.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: platform
  path: ./infrastructure/gateway
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
