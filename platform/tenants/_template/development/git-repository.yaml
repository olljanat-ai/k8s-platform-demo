# Development follows every commit of a branch (default "main").
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: tenant
  namespace: ${namespace}
spec:
  interval: 1m
  url: ${tenant_repo_url}
  # Azure DevOps access with the workload identity of source-controller
  # (microsoft.flux extension with workload identity enabled).
  provider: azure
  ref:
    branch: ${git_branch:=main}
