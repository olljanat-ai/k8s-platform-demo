apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: ${namespace}
spec:
  hard:
    requests.cpu: "${quota_requests_cpu:=4}"
    requests.memory: ${quota_requests_memory:=8Gi}
    limits.memory: ${quota_limits_memory:=16Gi}
    pods: "${quota_pods:=50}"
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-defaults
  namespace: ${namespace}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        memory: 256Mi
