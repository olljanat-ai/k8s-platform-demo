# Applies the tenant repository into this namespace, impersonating the
# flux-reconciler service account. targetNamespace forces every namespaced
# object into this namespace. The GitRepository "tenant" is defined per
# release channel (../development, ../acceptance, ../production).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenant
  namespace: ${namespace}
spec:
  serviceAccountName: flux-reconciler
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: tenant
  path: ${tenant_path}
  targetNamespace: ${namespace}
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-vars
